name: Update version

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: main-version
  cancel-in-progress: false

jobs:
  version:
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compute version
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo 'Initial branch push: keep the declared version.'
            exit 0
          fi
          python scripts/release_version.py --base "$BASE_SHA"
      - name: Commit version
        run: |
          if git diff --quiet -- x_operator/version.py uv.lock; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add x_operator/version.py uv.lock
          git commit -m 'chore(release): update application version'
          git push origin HEAD:main
