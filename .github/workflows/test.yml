name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked
      # Disposable databases and mock providers only; nothing contacts X or an LLM.
      - name: Regression tests
        run: uv run --with pytest --with pytest-asyncio pytest scripts -q -o asyncio_mode=auto -o main_file=
      - name: Offline smoke test
        run: uv run python scripts/smoke_test.py
