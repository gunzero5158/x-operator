[project]
name = "x-operator"
dynamic = ["version"]
description = "通用型 X（推特）半自动化运营工具 —— WebUI MVP"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "nicegui>=2.0",
    "apscheduler>=3.10",
    "httpx>=0.27",
    # 真实 X 适配器：official=tweepy（X API v2）/ unofficial=twifork（twikit 分支）
    "tweepy>=4.14,<5",
    "twifork>=2.4.0",
    "imageio-ffmpeg>=0.6,<0.7",
    # 仅安装控制库；Chromium 由用户在账号页按需下载。
    "playwright>=1.56,<2",
    "pyotp>=2.9,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["x_operator"]

[tool.hatch.version]
path = "x_operator/version.py"
